<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FootMasters</title>
<script>
window.FM_ERR=[];
window.addEventListener('error',function(e){try{window.FM_ERR.push(String(e.filename||'index.html').split('/').pop().split('?')[0]+' ligne '+e.lineno+' : '+e.message)}catch(_){}});

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 50% 0,#173a2a,#0b1410 60%) fixed;color:#f1f1f1;min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(8,14,11,.92);backdrop-filter:blur(6px);border-bottom:1px solid #2a3b32}
.logo{font-weight:900;font-size:20px}.logo b{color:#e8c66a}
.coins{background:#1d2a23;border:1px solid #e8c66a55;padding:6px 12px;border-radius:999px;font-weight:700;color:#ffe08a}
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:#0a120e;border-top:1px solid #2a3b32}
nav button{position:relative;flex:1;background:none;border:0;color:#9fb3a8;padding:8px 4px 12px;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:22px}nav button.on{color:#ffe08a}
#amiBadge{position:absolute;top:3px;left:50%;margin-left:8px;background:#ff3b3b;color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 6px;display:none}
main{max-width:1000px;margin:0 auto;padding:14px}
.tab{display:none}.tab.on{display:block}
h2{margin:16px 0 10px;font-size:19px}
.btn{background:linear-gradient(#f3d27a,#c99a2e);color:#1a1205;border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15px;cursor:pointer}
.btn.sec{background:#24352c;color:#eee;border:1px solid #3a5146}
.btn:disabled{opacity:.45;cursor:default}
.box{background:#121d17;border:1px solid #24352c;border-radius:16px;padding:14px;margin-bottom:14px}
.box p{margin:6px 0}
.center{text-align:center}.muted{color:#9fb3a8;font-size:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:800;font-size:13px;margin:3px}

/* ===== Booster (sachet noir et or) ===== */
.bag{position:relative;width:190px;height:280px;margin:18px auto;filter:drop-shadow(0 16px 22px rgba(0,0,0,.6))}
.bag .ptop,.bag .pbot{position:absolute;left:0;width:100%;background-repeat:no-repeat}
.bag .ptop{top:0;height:44px;z-index:3;transform-origin:15% 100%;
 background-image:linear-gradient(#e8c66a,#e8c66a),repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 2px,rgba(0,0,0,.4) 2px 4px),linear-gradient(90deg,rgba(0,0,0,.55),transparent 15%,transparent 85%,rgba(0,0,0,.55)),linear-gradient(160deg,#0b0c10 0%,#1f222a 28%,#3a3f4b 46%,#16181d 60%,#060709 100%);
 background-size:100% 2px,100% 18px,100% 100%,100% 280px;background-position:0 18px,0 0,0 0,0 0;
 -webkit-mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/10px 100% repeat-x;
 mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/10px 100% repeat-x}
.bag .pbot{top:44px;height:236px;overflow:hidden;z-index:1;
 background-image:linear-gradient(#e8c66a,#e8c66a),repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 2px,rgba(0,0,0,.4) 2px 4px),repeating-linear-gradient(135deg,rgba(232,198,106,.06) 0 10px,transparent 10px 20px),linear-gradient(90deg,rgba(0,0,0,.55),transparent 15%,transparent 85%,rgba(0,0,0,.55)),linear-gradient(160deg,#0b0c10 0%,#1f222a 28%,#3a3f4b 46%,#16181d 60%,#060709 100%);
 background-size:100% 2px,100% 18px,100% 100%,100% 100%,100% 280px;background-position:0 calc(100% - 18px),0 100%,0 0,0 0,0 -44px;
 -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/10px 100% repeat-x;
 mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/10px 100% repeat-x}
.bag .pbot::after{content:"";position:absolute;left:12px;right:12px;top:12px;bottom:30px;border:1.5px solid rgba(232,198,106,.55);border-radius:12px;pointer-events:none}
.bag .pbot::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,240,200,.35) 50%,transparent 65%);transform:translateX(-130%);animation:glint 3.2s ease-in-out infinite;z-index:2;pointer-events:none}
.bag .emb{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;z-index:1}
.bag .stars{color:#e8c66a;font-size:14px;letter-spacing:4px;margin-bottom:10px}
.bag .ball{width:92px;height:92px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle at 35% 30%,#2a2d35,#0c0d10 70%);border:3px solid #e8c66a;box-shadow:0 0 0 4px rgba(232,198,106,.22),0 0 30px rgba(232,198,106,.45),inset 0 0 18px rgba(0,0,0,.8)}
.bag .gl{width:110px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,#e8c66a,transparent)}
.bag .dash{position:absolute;top:43px;left:8px;right:8px;border-top:2px dashed rgba(232,198,106,.95);z-index:4;pointer-events:none}
.bag .cut{position:absolute;top:42px;left:0;width:0;height:4px;border-radius:2px;background:#fff;box-shadow:0 0 8px #fff,0 0 16px #ffd84d;z-index:5;pointer-events:none}
#pack{cursor:pointer}#pack .dash,#pack .cut{display:none}
#pack.ready{animation:float 3s ease-in-out infinite}
#pack.empty{filter:grayscale(1) brightness(.7);opacity:.6;cursor:default}
#pk{cursor:pointer;touch-action:none}
#pk.torn .ptop{animation:rip .8s cubic-bezier(.25,.7,.35,1) forwards}
#pk.torn .dash,#pk.torn .cut{opacity:0;transition:opacity .3s .2s}
@keyframes rip{0%{transform:none;opacity:1}25%{transform:translate(4px,-10px) rotate(-5deg);opacity:1}100%{transform:translate(90px,-230px) rotate(-32deg);opacity:0}}
@keyframes glint{0%,45%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ===== Cartes ===== */
.card{position:relative;width:100%;aspect-ratio:5/7;border-radius:1.2em;overflow:hidden;font-size:10px;box-shadow:0 .5em 1.2em rgba(0,0,0,.45);user-select:none}
.card::after{content:"";position:absolute;inset:.35em;border:1px solid rgba(255,255,255,.45);border-radius:.9em;pointer-events:none;z-index:3}
.r0{background:linear-gradient(160deg,#f0c39a,#a8704a 60%,#7a4c2e);color:#2b1608}
.r1{background:linear-gradient(160deg,#fff,#c9d0d8 55%,#8d97a3);color:#1d232a}
.r2{background:linear-gradient(160deg,#fff4c2,#f0c64a 50%,#b8861d);color:#2a1d02}
.r3{background:linear-gradient(160deg,#2a3a8f,#111a4d 55%,#070b24);color:#ffd96b}
.r4{background:linear-gradient(135deg,#ffd6f0,#c9e6ff 25%,#d6ffd1 50%,#fff2b8 75%,#ffd6f0);background-size:300% 300%;animation:holo 4s linear infinite;color:#1a1030}
@keyframes holo{0%{background-position:0 0}100%{background-position:300% 300%}}
.card .ph{position:absolute;left:0;right:0;top:0;height:70%}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;z-index:1;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.card .ini{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;font-size:2em;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);box-shadow:0 0 0 .1em rgba(255,255,255,.6)}
.card .note{position:absolute;top:.35em;left:.45em;font-size:2.8em;font-weight:900;z-index:2;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.card .pos{position:absolute;top:3.5em;left:.9em;font-size:1.1em;font-weight:800;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.bdg{position:absolute;top:.7em;right:.7em;width:3.6em;height:3.6em;border-radius:50%;display:grid;place-items:center;font-size:.8em;font-weight:900;color:#fff;text-shadow:0 1px 2px #000;border:.15em solid rgba(255,255,255,.85);z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.card .info{position:absolute;left:0;right:0;bottom:0;height:30%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 .6em;z-index:2}
.card .nm{font-weight:900;font-size:1.35em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tm{font-size:.95em;opacity:.8;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cnt{position:absolute;bottom:.6em;right:.7em;background:rgba(0,0,0,.75);color:#fff;border-radius:1em;padding:.1em .5em;font-size:1.1em;font-weight:800;z-index:4}
.card .new{position:absolute;bottom:31%;left:50%;transform:translateX(-50%);background:#ff3b3b;color:#fff;font-size:.9em;font-weight:900;padding:.2em .6em;border-radius:1em;z-index:4}
.card.lock{background:#17221d;color:#56695f;box-shadow:none}
.card.lock .ini{background:#22302a;color:#56695f;box-shadow:none;text-shadow:none}
.big{width:220px;margin:0 auto}.big .card{font-size:15px}

/* ===== Collection ===== */
.bar{height:8px;background:#0a120e;border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8c66a,#fff1b8)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{white-space:nowrap;background:#1b2922;border:1px solid #2f4439;color:#cfe;padding:7px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.chip.on{background:#e8c66a;color:#1a1205;border-color:#e8c66a;font-weight:800}
.chk{display:block;margin:10px 2px;color:#cfe;font-size:14px}
.team{margin:20px 0}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.thead .bdg{position:static;width:42px;height:42px;font-size:11px;flex:none}
.tcount{margin-left:auto;background:#1b2922;padding:4px 10px;border-radius:999px;font-weight:800}
.tcount.full{background:#e8c66a;color:#1a1205}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.grid .card{font-size:8.5px;cursor:pointer}

/* ===== Ouverture ===== */
#open{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;overflow:auto}
#open.on{display:block}
.stage{max-width:900px;margin:0 auto;padding:30px 12px 40px;text-align:center}
.hint{font-size:17px;font-weight:700}
.reveal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.flip{position:relative;width:calc(33.33% - 10px);max-width:165px;aspect-ratio:5/7;perspective:900px;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;z-index:1}
.flip.up .inner{transform:rotateY(180deg)}
.flip .back,.flip .front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px}
.flip .front{transform:rotateY(180deg)}
.flip .front .card{font-size:clamp(7px,2.3vw,10.5px)}
.flip .back{background:repeating-linear-gradient(135deg,rgba(232,198,106,.07) 0 8px,transparent 8px 16px),linear-gradient(160deg,#1f222a,#07080a);border:2px solid #e8c66a;display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.flip .back .ball{font-size:40px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:2px solid #e8c66a;box-shadow:0 0 18px rgba(232,198,106,.5)}
.flip:not(.up):hover{transform:translateY(-4px)}
.fx2 .front .card{box-shadow:0 0 16px 2px rgba(255,211,77,.75)}
.fx3 .front .card{box-shadow:0 0 22px 4px rgba(90,140,255,.9),0 0 40px rgba(232,198,106,.6)}
.fx4 .front .card{box-shadow:0 0 30px 6px rgba(255,255,255,.9),0 0 60px rgba(255,120,220,.7)}
.flip.fx3,.flip.fx4{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.burst{position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(rgba(255,215,90,.55) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%);animation:bu 1.3s ease-out forwards;pointer-events:none;z-index:0}
.burst.b4{background:repeating-conic-gradient(rgba(255,150,230,.6) 0 8deg,rgba(140,210,255,.5) 8deg 16deg,transparent 16deg 24deg)}
@keyframes bu{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) rotate(60deg)}}
.flash{position:fixed;inset:0;background:#fff;z-index:150;pointer-events:none;animation:fl .8s forwards}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}

/* ===== Enchères ===== */
.lot{display:flex;gap:12px;align-items:center;background:#121d17;border:1px solid #24352c;border-radius:14px;padding:10px;margin-bottom:10px}
.lot.lead{border-color:#4caf50}
.lc{width:88px;flex:none}.lc .card{font-size:7px}
.li{flex:1;min-width:0}.li .btn{padding:9px 14px;font-size:14px}
.lb{margin-top:6px}
.tm2{font-weight:800;color:#ffe08a;margin:6px 0}
.ok{color:#7ee081;font-weight:800}
.hist{padding:6px 0;border-bottom:1px solid #22332a;font-size:14px}

/* ===== Amis ===== */
.inp{width:100%;padding:9px 12px;border-radius:10px;border:1px solid #3a5146;background:#0a120e;color:#fff;font-size:15px;margin:6px 0}
.fcode{font-size:30px;font-weight:900;letter-spacing:6px;color:#ffe08a;margin:6px 0 10px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#121d17;border:1px solid #24352c;border-radius:14px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.frow .btn{padding:8px 12px;font-size:14px}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.mini>div{width:64px}.mini .card{font-size:5px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:300px;overflow:auto;padding:3px}
.tgrid .card{font-size:6px}
.tpick{cursor:pointer;border-radius:10px}
.tpick.sel{outline:3px solid #4caf50;outline-offset:1px}
.mbox h2{margin-top:0}

/* ===== Fenêtres ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
.mbox{background:#121d17;border:1px solid #2f4439;border-radius:18px;padding:16px;width:92%;max-width:380px;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1f2d26;border:1px solid #e8c66a77;color:#fff;padding:10px 16px;border-radius:12px;z-index:300;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center;font-size:14px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{position:fixed;top:60px;left:10px;right:10px;background:#b71c1c;color:#fff;padding:12px;border-radius:10px;z-index:400;text-align:center;font-weight:700}
</style>
</head>
<body>
<header><div class="logo">⚽ Foot<b>Masters</b></div><div class="coins" id="coins">…</div></header>
<main>
<section id="tab-pack" class="tab on">
  <div id="packWrap"></div>
  <p id="packInfo" class="center"></p>
  <div class="box center"><b>Chances pour chaque carte</b><br>
    <span class="pill r0">Bronze 22%</span><span class="pill r1">Argent 33%</span><span class="pill r2">Or 32%</span><span class="pill r3">Élite 10%</span><span class="pill r4">Légende 3%</span>
    <p class="muted">5 cartes par booster · la 5e est toujours Or ou mieux ✨</p>
  </div>
</section>
<section id="tab-col" class="tab"></section>
<section id="tab-auc" class="tab"></section>
<section id="tab-ami" class="tab"></section>
<section id="tab-pro" class="tab"></section>
</main>
<nav>
  <button data-t="pack" class="on"><span>🎁</span>Boosters</button>
  <button data-t="col"><span>📚</span>Collection</button>
  <button data-t="auc"><span>🔨</span>Enchères</button>
  <button data-t="ami"><span>👥</span>Amis<b id="amiBadge">0</b></button>

</nav>

<div id="modal"></div>
