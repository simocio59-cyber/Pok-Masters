<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1222">
<title>PokéMasters</title>
<style>
:root{--bg:#0b1222;--pan:#141c2f;--pan2:#1e293b;--txt:#e5e7eb;--mut:#94a3b8;--acc:#facc15;--red:#ef4444;--grn:#22c55e;--blu:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(60px + env(safe-area-inset-top)) 0 calc(80px + env(safe-area-inset-bottom))}
body.withbar{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pan2);color:var(--txt);transition:transform .1s}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:default;transform:none}
.btn-y{background:var(--acc);color:#111}.btn-r{background:var(--red);color:#fff}.btn-g{background:var(--grn);color:#fff}.btn-b{background:var(--blu);color:#fff}
button.big{font-size:18px;padding:14px 22px;border-radius:16px}
button.sm{padding:6px 10px;font-size:13px}
button.wide{display:block;width:100%;margin-top:8px}
input,select{font:inherit;font-size:16px;background:var(--pan2);color:var(--txt);border:1px solid #334155;border-radius:10px;padding:9px 10px;max-width:100%}
.hidden{display:none!important}
.mut{color:var(--mut);font-size:13px}
.c{text-align:center}
.good{color:#4ade80;font-weight:700}.bad{color:#f87171;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.c{justify-content:center}
.col{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sp{flex:1}
h2{margin:4px 0 12px;font-size:21px}h3{margin:18px 0 8px;font-size:16px}
main{max-width:720px;margin:0 auto;padding:12px}
.box{background:var(--pan);border-radius:14px;padding:12px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--pan2);border-radius:999px;padding:5px 10px;font-size:13px;white-space:nowrap}

/* ===== Barre du haut + navigation du bas ===== */
#top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(11,18,34,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #1e293b}
.logo{font-weight:900;font-size:18px;font-style:italic}.logo b{color:var(--acc)}
.logo.xl{font-size:40px}
.res{display:flex;gap:6px}
#timer{color:var(--mut);font-size:11px;font-weight:600}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:#0f172a;border-top:1px solid #1e293b;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;height:58px;background:none;border-radius:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:11px;position:relative}
#nav button i{font-style:normal;font-size:22px;line-height:1}
#nav button.on{color:var(--acc)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px;min-width:16px}
.badge:empty{display:none}
#login,#splash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#1e3a8a,#0b1222 70%)}

/* ===== CARTES (style classique) ===== */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:18px 8px;padding:10px 0 6px}
.card{position:relative;width:100%;border-radius:12px;padding:20px 5px 12px;background:linear-gradient(160deg,#1f2937,#0b1222);border:3px solid var(--rc);text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.45);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .15s}
.card:active{transform:scale(.97)}
.card.shiny{box-shadow:0 0 14px 3px rgba(250,204,21,.7)}
.card.sel{outline:3px solid #fff;outline-offset:2px;transform:scale(.95)}
.card .num{position:absolute;top:5px;left:7px;font-size:11px;color:#94a3b8;font-weight:700}
.card .cnt{position:absolute;top:4px;right:5px;background:#facc15;color:#111;font-weight:800;font-size:11px;border-radius:10px;padding:1px 6px}
.card img{width:105px;max-width:100%;aspect-ratio:1/1;object-fit:contain;display:block;margin:0 auto 4px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.card .nm{font-weight:800;font-size:13px;line-height:1.15;word-break:break-word}
.card .rar{font-size:11px;font-weight:700;color:var(--rc);margin-top:2px}
.card .types{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.tp{display:inline-block;font-size:10px;padding:2px 6px;border-radius:8px;color:#fff;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.card .new{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;font-size:10px;font-weight:900;padding:2px 8px;border-radius:8px;white-space:nowrap;animation:pop .8s infinite alternate}
.card .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;white-space:nowrap;z-index:2}
.card.miss img{filter:brightness(0) opacity(.45)}
.card.miss .nm,.card.miss .rar{color:#64748b}
@keyframes pop{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.12)}}

/* ===== Pokéball CSS ===== */
.ball{display:block;width:80px;aspect-ratio:1/1;border-radius:50%;background:linear-gradient(to bottom,#ef4444 0 46%,#111 46% 54%,#f8fafc 54% 100%);border:3px solid #111;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.ball::after{content:"";position:absolute;width:32%;aspect-ratio:1/1;border-radius:50%;background:#f8fafc;border:3px solid #111;left:50%;top:50%;transform:translate(-50%,-50%)}

/* ===== Booster ===== */
.bz{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:8px}
.pack{position:relative;width:180px;height:270px;border-radius:14px;background:linear-gradient(160deg,#2563eb,#7c3aed 55%,#db2777);box-shadow:0 12px 30px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pack::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);animation:shine 3s infinite;pointer-events:none}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.pack.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-1deg)}}
.pack.big{width:min(62vw,240px);height:auto;aspect-ratio:2/3}
.ptop{position:absolute;top:0;left:0;right:0;height:13%;background:rgba(255,255,255,.2);border-bottom:2px dashed rgba(255,255,255,.7);transition:transform .5s ease-in,opacity .5s;z-index:2}
.pack.torn .ptop{transform:translate(70%,-120%) rotate(28deg);opacity:0}
.pack.torn{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.06)}}
.cut{position:absolute;top:13%;left:0;height:3px;width:0;background:#fff;box-shadow:0 0 10px #fff;z-index:3}
.plogo{font-weight:900;font-size:24px;font-style:italic;text-shadow:0 3px 0 #1e3a8a;z-index:1}
.psub{font-weight:700;opacity:.9;z-index:1}
.pack .ball{z-index:1;width:84px}
.bcount{font-size:22px}

/* ===== Ouverture plein écran ===== */
#opening{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 35%,#1e3a8a 0%,#0b1222 65%);display:flex;flex-direction:column;padding:calc(56px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.op-wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.op-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.op-hint{text-align:center;font-weight:700;font-size:17px}
.op-msg{min-height:26px;font-weight:800;font-size:18px;text-align:center}
.flip{width:min(64vw,250px);aspect-ratio:63/88;perspective:1200px;cursor:pointer}
.flip.enter{animation:deal .45s ease-out}
@keyframes deal{from{transform:translateY(-40px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.fi{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px}
.front{transform:rotateY(180deg)}
.front .card{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 8px 14px}
.front .card img{width:78%}
.front .card .nm{font-size:19px}.front .card .rar{font-size:13px}.front .card .tp{font-size:12px}
.flip.glow .back{animation:glow 1s infinite alternate}
.flip.wow .front .card{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 10px 2px rgba(250,204,21,.5)}to{box-shadow:0 0 34px 10px rgba(250,204,21,.95)}}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px;width:100%;max-width:440px}

/* ===== DOS DE CARTE (image dos-carte.png, sinon dos de secours) ===== */
.back{overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);border:7px solid #1e3a8a;background:radial-gradient(circle at 50% 50%,#93c5fd 0%,#3b82f6 30%,#1d4ed8 60%,#1e3a8a 100%)}
.hasBack .back{background:var(--backimg) center/cover no-repeat;border:0}
.hasBack .back .fb{display:none}
.fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8% 0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.08) 0deg 12deg,transparent 12deg 24deg)}
.fb-logo{font-weight:900;font-style:italic;font-size:clamp(16px,6vw,28px);color:#facc15;-webkit-text-stroke:1.2px #1e3a8a;text-shadow:2px 2px 0 #1e3a8a}
.fb-logo.r{transform:rotate(180deg)}
.fb .ball{width:46%}

/* ===== Onglet Cartes ===== */
.seg{display:flex;background:var(--pan2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;background:none;padding:9px}
.seg button.on{background:var(--acc);color:#111}
.prog{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.pbar{flex:1;height:9px;background:#334155;border-radius:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#facc15,#f97316);width:0}
#cSearch,#bSearch{width:100%;margin-bottom:8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.filters select{width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px}

/* ===== Fenêtres (bottom-sheet) ===== */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:88vh;overflow-y:auto;background:#111a2e;border-radius:20px 20px 0 0;padding:8px 14px calc(16px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:9px;background:#334155;margin:4px auto 10px}
.sticky{position:sticky;bottom:0;background:#111a2e;padding:10px 0 4px;display:flex;gap:8px;justify-content:center;margin-top:8px;border-top:1px solid #1e293b}
.cm{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.cm-card{width:140px;flex:none}
.cm-info{flex:1;min-width:180px}
.cm-info h3{margin:0 0 4px}
.st{display:grid;grid-template-columns:64px 1fr 30px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.sb{height:7px;background:#334155;border-radius:9px;overflow:hidden}
.sb i{display:block;height:100%;background:var(--blu)}
.miss-big img{width:160px;filter:brightness(0) opacity(.5)}
table.odds{width:100%;border-collapse:collapse;margin:8px 0}
table.odds td{padding:8px 6px;border-bottom:1px solid #1e293b}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#f8fafc;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Combat ===== */
#teamBar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:45;background:#0f172a;border-top:1px solid #1e293b;padding:8px 12px;display:flex;align-items:center;gap:8px;justify-content:center}
.slot{width:50px;height:50px;border-radius:12px;background:var(--pan2);display:flex;align-items:center;justify-content:center;border:2px dashed #475569;color:var(--mut);font-weight:900}
.slot img{width:46px;height:46px;object-fit:contain}
#teamBar .btn-r{flex:1;max-width:220px}
.arena{display:flex;flex-direction:column;gap:8px}
.ahd{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px}
.l0{color:#4ade80}.l1{color:#60a5fa}.l2{color:#c084fc}.l3{color:#fb923c}.l4{color:#f43f5e}
.fighter{display:flex;align-items:center;gap:10px;background:var(--pan);border-radius:14px;padding:8px 10px}
.fighter img{width:70px;height:70px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.fi-info{flex:1;min-width:0}
.types-row{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.hp{height:10px;background:#334155;border-radius:9px;overflow:hidden;margin:5px 0 2px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#86efac);transition:width .5s}
.fighter.hit{animation:hit .4s}
@keyframes hit{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.teamrow{display:flex;gap:6px;justify-content:center}
.teamrow img{width:40px;height:40px;object-fit:contain;background:var(--pan2);border-radius:10px;padding:2px}
.teamrow img.act{outline:2px solid var(--acc)}
.teamrow img.ko{filter:grayscale(1) opacity(.35)}
.qbox{background:var(--pan);border-radius:14px;padding:10px}
.tbar{height:8px;background:#334155;border-radius:9px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--acc)}
.tbar i.low{background:var(--red)}
.adv{font-size:12px;color:#fde047;text-align:center;margin-top:4px}
.qtxt{text-align:center;font-size:16px;margin:8px 0}
.qimg{display:block;width:110px;height:110px;object-fit:contain;margin:0 auto 6px;transition:filter .4s}
.qimg.sil{filter:brightness(0)}
.qimg.blur{filter:brightness(0) blur(6px)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answers button{padding:12px 6px;min-height:48px}
.answers button.good{background:var(--grn);color:#fff}
.answers button.bad{background:var(--red);color:#fff}
.blog{min-height:18px;font-size:13px;color:#cbd5e1;text-align:center}

/* ===== Amis / échanges / enchères ===== */
.code{font-family:ui-monospace,monospace;font-size:24px;font-weight:900;letter-spacing:3px;color:var(--acc)}
.item{display:flex;align-items:center;gap:6px;background:var(--pan);border-radius:12px;padding:10px;margin-bottom:8px}
.item button{padding:8px 10px}
.trade{background:var(--pan);border-radius:14px;padding:10px;margin-bottom:10px}
.tr-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0}
.tr-c{width:120px;text-align:center}
.trade.small .tr-c{width:100px}
.arrow{font-size:26px}
.steps{font-size:13px;color:var(--mut);text-align:center}
.menu{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.menu button{text-align:left;padding:14px;background:var(--pan)}
.lots{display:flex;flex-direction:column;gap:10px}
.lot{display:flex;gap:12px;align-items:center;background:var(--pan);border-radius:14px;padding:10px}
.lot .card{width:118px;flex:none}
.lot-i{flex:1;display:flex;flex-direction:column;gap:4px;font-size:14px}
.price{font-size:20px;font-weight:900;color:var(--acc)}
</style>
</head>
<body>
<div id="splash"><div class="logo xl">Poké<b>Masters</b></div><div class="mut">Chargement…</div></div>
<div id="login" class="hidden">
  <div class="logo xl">Poké<b>Masters</b></div>
  <span class="ball" style="width:110px"></span>
  <p>Collectionne les cartes Pokémon, combats et échange avec tes amis !</p>
  <button class="btn-y big" id="btnLogin">Se connecter avec Google</button>
</div>
<header id="top" class="hidden">
  <div class="logo">Poké<b>Masters</b></div>
  <div class="res"><span class="pill">💰 <b id="coins">0</b></span><span class="pill">🎁 <b id="boosters">0</b> <span id="timer"></span></span></div>
</header>
<main id="app" class="hidden">
  <section id="v-booster"></section>
  <section id="v-cards" class="hidden"></section>
  <section id="v-battle" class="hidden"></section>
  <section id="v-friends" class="hidden"></section>
  <section id="v-more" class="hidden"></section>
  <section id="v-auction" class="hidden"></section>
</main>
<div id="teamBar" class="hidden"></div>
<nav id="nav" class="hidden">
  <button data-go="booster"><i>🎁</i><span>Booster</span></button>
  <button data-go="cards"><i>🃏</i><span>Cartes</span></button>
  <button data-go="battle"><i>⚔️</i><span>Combat</span></button>
  <button data-go="friends"><i>👥</i><span>Amis</span><em class="badge" id="fBadge"></em></button>
  <button data-go="more"><i>☰</i><span>Plus</span></button>
</nav>
<div id="sheetBg" class="hidden"></div>
<div id="sheet" class="hidden"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="opening" class="hidden"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, query, where, getDocs, addDoc, deleteDoc, writeBatch, arrayUnion, arrayRemove, runTransaction, deleteField, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 👇👇👇 TA CONFIG FIREBASE (ne pas toucher) 👇👇👇
const firebaseConfig = {
  apiKey: "AIzaSyDceV0GEYc8U0RYdYpIVhDRWNLvI6S0N1o",
  authDomain: "pokemasters-fb446.firebaseapp.com",
  projectId: "pokemasters-fb446",
  storageBucket: "pokemasters-fb446.firebasestorage.app",
  messagingSenderId: "717761799225",
  appId: "1:717761799225:web:15d7464c7106fd8dcd99e8"
};
// 👆👆👆 FIN DE LA CONFIG 👆👆👆

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= OUTILS ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const vib = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800); }

/* ================= RÉGLAGES DU JEU ================= */
const MAX = 1025;
const BOOST_MS = 5 * 60 * 1000, BOOST_MAX = 10, BOOST_PRICE = 150, PER_PACK = 5;
const ODDS = [50, 30, 14.5, 4, 1.2, 0.3];

function eff(a, defs) { const c = CHART[a]; if (!c) return 1; let m = 1; for (const d of defs) { if (c[2].includes(d)) m *= 0; else if (c[0].includes(d)) m *= 2; else if (c[1].includes(d)) m *= 0.5; } return m; }

/* ================= INFOS POKÉMON (mémorisées sur l’appareil) ================= */
const META_KEY = 'pm_meta_v3';
let META = {};
try { META = JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch (e) { META = {}; }
let metaSaveT = null;
function saveMeta() { clearTimeout(metaSaveT); metaSaveT = setTimeout(() => { try { localStorage.setItem(META_KEY, JSON.stringify(META)); } catch (e) {} }, 800); }
const PENDING = {};
function rarityOf(id, bst) { if (MYTH.includes(id)) return 5; if (LEG.includes(id)) return 4; return bst >= 530 ? 3 : bst >= 450 ? 2 : bst >= 330 ? 1 : 0; }
async function fetchJSON(url) {
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(url); if (r.ok) return await r.json(); } catch (e) {}
    await sleep(400 * (i + 1));
  }
  throw new Error('réseau');
}
function getMeta(id) {
  id = +id;
  if (META[id]) return Promise.resolve(META[id]);
  if (PENDING[id]) return PENDING[id];
  PENDING[id] = (async () => {
    const [p, s] = await Promise.all([fetchJSON('https://pokeapi.co/api/v2/pokemon/' + id), fetchJSON('https://pokeapi.co/api/v2/pokemon-species/' + id)]);
    const fr = s.names.find(n => n.language.name === 'fr');
    const st = {}; p.stats.forEach(x => { st[x.stat.name] = x.base_stat; });
    const s6 = [st.hp, st.attack, st.defense, st['special-attack'], st['special-defense'], st.speed].map(v => v || 50);
    const b = s6.reduce((a, c) => a + c, 0);
    const m = { n: fr ? fr.name : s.name, t: p.types.slice().sort((a, c) => a.slot - c.slot).map(x => x.type.name), s: s6, b, r: rarityOf(id, b) };
    META[id] = m; saveMeta(); delete PENDING[id];
    return m;
  })();
  PENDING[id].catch(() => { delete PENDING[id]; });
  return PENDING[id];
}
async function loadMetas(ids) {
  const list = [...new Set(ids.map(Number))].filter(id => id >= 1 && id <= MAX && !META[id]);
  let i = 0;
  const worker = async () => { while (i < list.length) { const id = list[i++]; try { await getMeta(id); } catch (e) {} } };
  await Promise.all(Array.from({ length: Math.min(8, list.length) }, worker));
}
const TRIED = new Set();
function needMetas(ids, cb) {
  const miss = [...new Set(ids.map(Number))].filter(id => !META[id] && !TRIED.has(id));
  if (!miss.length) return;
  miss.forEach(id => TRIED.add(id));
  loadMetas(miss).then(cb);
}

/* ================= TIRAGE ================= */
function rollRarity() { let x = Math.random() * 100; for (let r = 0; r < ODDS.length; r++) { if (x < ODDS[r]) return r; x -= ODDS[r]; } return 0; }
async function pickIdOfRarity(r) {
  if (r === 5) return MYTH[rand(MYTH.length)];
  if (r === 4) return LEG[rand(LEG.length)];
  for (let round = 0; round < 5; round++) {
    const c = new Set();
    while (c.size < 8) { const id = 1 + rand(MAX); if (!SPECIAL.has(id)) c.add(id); }
    const cand = [...c];
    let hit = cand.find(id => META[id] && META[id].r === r);
    if (hit) return hit;
    await loadMetas(cand);
    hit = cand.find(id => META[id] && META[id].r === r);
    if (hit) return hit;
  }
  const known = Object.keys(META).map(Number).filter(id => !SPECIAL.has(id) && META[id].r === r);
  if (known.length) return known[rand(known.length)];
  return r === 3 ? EPIC_FB[rand(EPIC_FB.length)] : 1 + rand(151);
}
function rollPack() {
  return Promise.all(Array.from({ length: PER_PACK }, async () => {
    const id = await pickIdOfRarity(rollRarity());
    return id + (Math.random() < SHINY ? 's' : '');
  }));
}

async function newFriendCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (let t = 0; t < 6; t++) {
    let c = ''; for (let i = 0; i < 6; i++) c += A[rand(A.length)];
    const q = await getDocs(query(collection(db, 'users'), where('friendCode', '==', c)));
    if (q.empty) return c;
  }
  return ('Z' + Date.now().toString(36)).slice(-6).toUpperCase();
}

async function initUser(u) {
  const ref = doc(db, 'users', u.uid);
  const snap = await getDoc(ref);
  const now = Date.now();
  const base = { pseudo: '', coins: 300, boosters: BOOST_MAX, lastBoost: now, cards: {}, showcase: [], friends: [], bestWave: 0, usedCodes: [] };
  if (!snap.exists()) {
    await setDoc(ref, { ...base, friendCode: await newFriendCode() });
  } else {
    const d = snap.data(), fix = {};
    if ('email' in d) fix.email = deleteField();
    if (!d.friendCode) fix.friendCode = await newFriendCode();
    for (const [k, v] of Object.entries(base)) if (d[k] === undefined) fix[k] = v;
    if (Object.keys(fix).length) await updateDoc(ref, fix);
  }
  const warn = e => console.warn(e);
  unsubs.push(onSnapshot(ref, s => { if (!s.exists()) return; ME = s.data(); onMe(); }, warn));
  unsubs.push(onSnapshot(query(collection(db, 'friendRequests'), where('to', '==', u.uid)), s => {
    FR_IN = s.docs.map(d => ({ id: d.id, ...d.data() })); updateBadge(); if (view === 'friends') renderFriends();
  }, warn));
  unsubs.push(onSnapshot(query(collection(db, 'trades'), where('to', '==', u.uid)), s => {
    TR_IN = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.status === 'pending'); updateBadge(); if (view === 'friends') renderFriends();
  }, warn));
  unsubs.push(onSnapshot(query(collection(db, 'trades'), where('from', '==', u.uid)), s => {
    TR_OUT = s.docs.map(d => ({ id: d.id, ...d.data() })); if (view === 'friends') renderFriends();
  }, warn));
  loadAuc();
}

/* ================= BOOSTERS (stock + minuteur) ================= */
function boostState() {
  const now = Date.now();
  let b = ME?.boosters ?? 0, last = ME?.lastBoost ?? now;
  if (last && typeof last.toMillis === 'function') last = last.toMillis();
  if (b >= BOOST_MAX) return { b, last: now, next: 0 };
  const g = Math.floor((now - last) / BOOST_MS);
  if (g > 0) { b = Math.min(BOOST_MAX, b + g); last = b >= BOOST_MAX ? now : last + g * BOOST_MS; }
  return { b, last, next: b >= BOOST_MAX ? 0 : last + BOOST_MS - now };
}
function updateTop() {
  if (!ME) return;
  const st = boostState();
  $('#coins').textContent = ME.coins || 0;
  $('#boosters').textContent = st.b;
  $('#timer').textContent = st.b >= BOOST_MAX ? '' : fmt(st.next);
}

async function openBooster() {
  if (opening || !ME) return;
  const st = boostState();
  const paid = st.b <= 0;
  if (paid && (ME.coins || 0) < BOOST_PRICE) return toast(`Plus de booster ! Attends le prochain ou gagne ${BOOST_PRICE} 💰`);
  opening = true; vib(20);
  const before = { ...cardsOf() };
  const ov = $('#opening');
  ov.classList.remove('hidden');
  ov.innerHTML = `<div class="op-wrap">
    <div class="op-hint">✂️ Glisse ton doigt sur le paquet pour l’ouvrir<br><small class="mut">(ou touche-le)</small></div>
    <div class="pack big" id="bigPack"><div class="ptop"></div><div class="cut" id="cut"></div><div class="plogo">PokéMasters</div><span class="ball"></span><div class="psub">5 cartes</div></div>
    <div class="mut" id="opLoad">${paid ? `−${BOOST_PRICE} 💰` : ''}</div></div>`;
  let keys = null, err = null;
  const job = (async () => {
    const ks = await rollPack();
    const cnt = {}; ks.forEach(k => { cnt[k] = (cnt[k] || 0) + 1; });
    const upd = {};
    for (const [k, n] of Object.entries(cnt)) upd['cards.' + k] = increment(n);
    if (paid) upd.coins = increment(-BOOST_PRICE);
    else { upd.boosters = st.b - 1; upd.lastBoost = st.b >= BOOST_MAX ? Date.now() : st.last; }
    await updateDoc(meRef(), upd);
    await loadMetas(ks.map(keyId));
    ks.forEach(k => { const im = new Image(); im.src = img(keyId(k), keySh(k)); });
    keys = ks;
  })().catch(e => { console.error(e); err = e; });

  const pack = $('#bigPack');
  let sx = null, torn = false;
  const tear = async () => {
    if (torn) return; torn = true;
    pack.classList.add('torn'); vib(40);
    if (!keys && !err) { $('#opLoad').textContent = 'Préparation des cartes…'; await job; }
    if (err) { closeOpening(); return toast('Oups, souci de connexion. Réessaie !'); }
    setTimeout(() => revealFlow(keys, before), 500);
  };
  pack.addEventListener('pointerdown', e => { sx = e.clientX; try { pack.setPointerCapture(e.pointerId); } catch (_) {} });
  pack.addEventListener('pointermove', e => {
    if (sx === null || torn) return;
    const dx = Math.abs(e.clientX - sx);
    $('#cut').style.width = Math.min(100, dx / 1.5) + '%';
    if (dx > 110) tear();
  });
  pack.addEventListener('pointerup', () => { sx = null; tear(); });
}

function revealFlow(keys, before) {
  const ov = $('#opening');
  const score = k => (META[keyId(k)]?.r || 0) + (keySh(k) ? 3.5 : 0);
  const special = k => (META[keyId(k)]?.r || 0) >= 3 || keySh(k);
  const order = [...keys].sort((a, b) => score(a) - score(b));
  let i = 0, flipped = false;

  const summary = () => {
    const newCount = new Set(order.filter(k => !before[k])).size;
    const st = boostState();
    const canAgain = st.b > 0 || (ME.coins || 0) >= BOOST_PRICE;
    ov.innerHTML = `<div class="op-wrap">
