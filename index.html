<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1222">
<title>PokéMasters</title>
<style>
:root{--bg:#0b1222;--pan:#141c2f;--pan2:#1e293b;--txt:#e5e7eb;--mut:#94a3b8;--acc:#facc15;--red:#ef4444;--grn:#22c55e;--blu:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(60px + env(safe-area-inset-top)) 0 calc(80px + env(safe-area-inset-bottom))}
body.withbar{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--pan2);color:var(--txt);transition:transform .1s}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:default;transform:none}
.btn-y{background:var(--acc);color:#111}.btn-r{background:var(--red);color:#fff}.btn-g{background:var(--grn);color:#fff}
button.big{font-size:18px;padding:14px 22px;border-radius:16px}
button.sm{padding:6px 10px;font-size:13px}
button.wide{display:block;width:100%;margin-top:8px}
input,select{font:inherit;font-size:16px;background:var(--pan2);color:var(--txt);border:1px solid #334155;border-radius:10px;padding:9px 10px;max-width:100%}
.hidden{display:none!important}
.mut{color:var(--mut);font-size:13px}
.c{text-align:center}
.good{color:#4ade80;font-weight:700}.bad{color:#f87171;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.c{justify-content:center}
.col{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sp{flex:1;min-width:0}
h2{margin:4px 0 12px;font-size:21px}h3{margin:18px 0 8px;font-size:16px}
main{max-width:720px;margin:0 auto;padding:12px}
.box{background:var(--pan);border-radius:14px;padding:12px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--pan2);border-radius:999px;padding:5px 10px;font-size:13px;white-space:nowrap}
#top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(11,18,34,.94);border-bottom:1px solid #1e293b}
.logo{font-weight:900;font-size:18px;font-style:italic}.logo b{color:var(--acc)}
.logo.xl{font-size:40px}
.res{display:flex;gap:6px}
#timer{color:var(--mut);font-size:11px;font-weight:600}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;background:#0f172a;border-top:1px solid #1e293b;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;height:58px;background:none;border-radius:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:10px;position:relative}
#nav button i{font-style:normal;font-size:20px;line-height:1}
#nav button.on{color:var(--acc)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px;min-width:16px}
.badge:empty{display:none}
#login,#splash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#1e3a8a,#0b1222 70%)}

/* ===== CARTES ===== */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:18px 8px;padding:10px 0 6px}
.card{position:relative;width:100%;border-radius:12px;padding:20px 5px 12px;background:linear-gradient(160deg,#1f2937,#0b1222);border:3px solid var(--rc);text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.45);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .15s}
.card:active{transform:scale(.97)}
.card.shiny{box-shadow:0 0 14px 3px rgba(250,204,21,.7)}
.card.sel{outline:3px solid #fff;outline-offset:2px;transform:scale(.95)}
.card .num{position:absolute;top:5px;left:7px;font-size:11px;color:#94a3b8;font-weight:700}
.card .cnt{position:absolute;top:4px;right:5px;background:#facc15;color:#111;font-weight:800;font-size:11px;border-radius:10px;padding:1px 6px;z-index:2}
.card img{width:105px;max-width:100%;aspect-ratio:1/1;object-fit:contain;display:block;margin:0 auto 4px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.card .nm{font-weight:800;font-size:13px;line-height:1.15;word-break:break-word}
.card .rar{font-size:11px;font-weight:700;color:var(--rc);margin-top:2px}
.types{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.tp{display:inline-block;font-size:10px;padding:2px 6px;border-radius:8px;color:#fff;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.card .new{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;font-size:10px;font-weight:900;padding:2px 8px;border-radius:8px;white-space:nowrap;animation:pop .8s infinite alternate;z-index:2}
.card .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;white-space:nowrap;z-index:2}
.card.miss img{filter:brightness(0) opacity(.45)}
.card.miss .nm,.card.miss .rar{color:#64748b}
@keyframes pop{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.12)}}
/* Carte Ultra Rare EX (illustration pleine) */
.card.ex{padding:0;border:3px solid transparent;background:radial-gradient(circle at 75% 18%,rgba(255,255,255,.75) 0 7%,transparent 8%) padding-box,linear-gradient(175deg,#fde68a 0%,var(--c1) 38%,var(--c2) 72%,#1e1b4b 100%) padding-box,linear-gradient(135deg,#f87171,#facc15,#4ade80,#60a5fa,#c084fc,#f87171) border-box;aspect-ratio:63/88;display:flex;flex-direction:column;box-shadow:0 0 16px rgba(240,171,252,.6)}
.card.ex::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%);background-size:250% 100%;animation:holo 3s linear infinite;pointer-events:none;mix-blend-mode:overlay}
@keyframes holo{from{background-position:150% 0}to{background-position:-100% 0}}
.exh{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:5px 6px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;background:rgba(0,0,0,.28);border-radius:9px 9px 0 0;text-align:left}
.exh b{font-size:12px;line-height:1.1}.exh i{color:#facc15;font-weight:900;font-size:13px}
.card.ex img{width:100%;max-width:100%;flex:1;min-height:0;margin:0;transform:scale(1.12)}
.exf{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;padding:4px;background:rgba(0,0,0,.3);border-radius:0 0 9px 9px}
.front .card.ex img{width:100%}

.ball{display:block;width:80px;aspect-ratio:1/1;border-radius:50%;background:linear-gradient(to bottom,#ef4444 0 46%,#111 46% 54%,#f8fafc 54% 100%);border:3px solid #111;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.ball::after{content:"";position:absolute;width:32%;aspect-ratio:1/1;border-radius:50%;background:#f8fafc;border:3px solid #111;left:50%;top:50%;transform:translate(-50%,-50%)}

/* ===== Booster ===== */
.bz{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:8px}
.pack{position:relative;width:180px;height:270px;border-radius:14px;background:linear-gradient(160deg,#2563eb,#7c3aed 55%,#db2777);box-shadow:0 12px 30px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:filter .3s}
.pack::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);animation:shine 3s infinite;pointer-events:none}
.pack.empty{filter:grayscale(.85) brightness(.55);cursor:default}
.pack.empty.float{animation:none}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.pack.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-1deg)}}
.pack.big{width:min(62vw,240px);height:auto;aspect-ratio:2/3}
.ptop{position:absolute;top:0;left:0;right:0;height:13%;background:rgba(255,255,255,.2);border-bottom:2px dashed rgba(255,255,255,.7);transition:transform .5s ease-in,opacity .5s;z-index:2}
.pack.torn .ptop{transform:translate(70%,-120%) rotate(28deg);opacity:0}
.pack.torn{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.06)}}
.cut{position:absolute;top:13%;left:0;height:3px;width:0;background:#fff;box-shadow:0 0 10px #fff;z-index:3}
.plogo{font-weight:900;font-size:24px;font-style:italic;text-shadow:0 3px 0 #1e3a8a;z-index:1}
.psub{font-weight:700;opacity:.9;z-index:1}
.pack .ball{z-index:1;width:84px}
.bcount{font-size:22px}
#opening,#tfx{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 35%,#1e3a8a 0%,#0b1222 65%);display:flex;flex-direction:column;padding:calc(56px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden}
#tfx{z-index:92;background:radial-gradient(circle at 50% 35%,#155e75 0%,#0b1222 65%)}
.op-wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.op-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.op-hint{text-align:center;font-weight:700;font-size:17px}
.op-msg{min-height:26px;font-weight:800;font-size:20px;text-align:center}
.flip{width:min(64vw,250px);aspect-ratio:63/88;perspective:1200px;cursor:pointer}
.flip.enter{animation:deal .45s ease-out}
@keyframes deal{from{transform:translateY(-40px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.fi{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px}
.front{transform:rotateY(180deg)}
.front .card{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 8px 14px}
.front .card.ex{padding:0;align-items:stretch}
.front .card img{width:78%}
.front .card .nm{font-size:19px}.front .card .rar{font-size:13px}.front .card .tp{font-size:12px}
.front .exh b{font-size:17px}.front .exf{font-size:14px}
.flip.charge .back{animation:charge .7s infinite alternate}
@keyframes charge{from{box-shadow:0 0 8px 2px var(--gc)}to{box-shadow:0 0 45px 16px var(--gc)}}
.flip.shake{animation:shk .35s infinite}
@keyframes shk{25%{transform:rotate(-2.5deg) scale(1.02)}75%{transform:rotate(2.5deg) scale(1.02)}}
.flip.wow .front .card{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 10px 2px var(--gc)}to{box-shadow:0 0 38px 12px var(--gc)}}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px;width:100%;max-width:440px}
/* Effets de rareté */
.burst{position:fixed;inset:0;pointer-events:none;z-index:97;overflow:hidden}
.rays{position:absolute;left:50%;top:45%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(var(--gc) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 5%,transparent 40%);mask:radial-gradient(circle,#000 5%,transparent 40%);opacity:0;animation:rays 2s ease-out forwards}
.rays.rb{background:repeating-conic-gradient(#f87171 0 6deg,transparent 6deg 12deg,#facc15 12deg 18deg,transparent 18deg 24deg,#4ade80 24deg 30deg,transparent 30deg 36deg,#60a5fa 36deg 42deg,transparent 42deg 48deg,#c084fc 48deg 54deg,transparent 54deg 60deg)}
@keyframes rays{0%{opacity:0;transform:scale(.3) rotate(0)}20%{opacity:.8}100%{opacity:0;transform:scale(1) rotate(80deg)}}
.pt{position:absolute;left:50%;top:45%;width:10px;height:10px;border-radius:50%;animation:pt 1.3s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;animation:flash .7s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
/* Échange */
.tstage{height:min(92vw,360px);display:flex;align-items:center;justify-content:center;width:100%}
.flip.away{transition:transform .9s ease-in,opacity .9s;transform:translateY(-75vh) scale(.4) rotate(-20deg);opacity:0}
.flip.drop{animation:drop .9s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-75vh) scale(.4) rotate(20deg);opacity:0}to{transform:none;opacity:1}}
.tspin{font-size:70px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== DOS DE CARTE ===== */
.back{overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);border:7px solid #1e3a8a;background:radial-gradient(circle at 50% 50%,#93c5fd 0%,#3b82f6 30%,#1d4ed8 60%,#1e3a8a 100%)}
.hasBack .back{background:var(--backimg) center/cover no-repeat;border:0}
.hasBack .back .fb{display:none}
.fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8% 0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.08) 0deg 12deg,transparent 12deg 24deg)}
.fb-logo{font-weight:900;font-style:italic;font-size:clamp(16px,6vw,28px);color:#facc15;-webkit-text-stroke:1.2px #1e3a8a;text-shadow:2px 2px 0 #1e3a8a}
.fb-logo.r{transform:rotate(180deg)}
.fb .ball{width:46%}

.seg{display:flex;background:var(--pan2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;background:none;padding:9px}
.seg button.on{background:var(--acc);color:#111}
.prog{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.pbar{flex:1;height:9px;background:#334155;border-radius:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#facc15,#f97316);width:0}
#cSearch,#bSearch{width:100%;margin-bottom:8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.filters select{width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:88vh;overflow-y:auto;background:#111a2e;border-radius:20px 20px 0 0;padding:8px 14px calc(16px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:9px;background:#334155;margin:4px auto 10px}
.sticky{position:sticky;bottom:0;background:#111a2e;padding:10px 0 4px;display:flex;gap:8px;justify-content:center;margin-top:8px;border-top:1px solid #1e293b}
.cm{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.cm-card{width:140px;flex:none}
.cm-info{flex:1;min-width:180px}
.cm-info h3{margin:0 0 4px}
.st{display:grid;grid-template-columns:64px 1fr 30px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.sb{height:7px;background:#334155;border-radius:9px;overflow:hidden}
.sb i{display:block;height:100%;background:var(--blu)}
table.odds{width:100%;border-collapse:collapse;margin:8px 0}
table.odds td{padding:7px 6px;border-bottom:1px solid #1e293b}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#f8fafc;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Combat ===== */
#teamBar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:45;background:#0f172a;border-top:1px solid #1e293b;padding:8px 12px;display:flex;align-items:center;gap:8px;justify-content:center}
.slot{width:50px;height:50px;border-radius:12px;background:var(--pan2);display:flex;align-items:center;justify-content:center;border:2px dashed #475569;color:var(--mut);font-weight:900}
.slot img{width:46px;height:46px;object-fit:contain}
#teamBar .btn-r{flex:1;max-width:220px}
.arena{display:flex;flex-direction:column;gap:10px}
.ahd{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px}
.l0{color:#4ade80}.l1{color:#60a5fa}.l2{color:#c084fc}.l3{color:#fb923c}.l4{color:#f43f5e}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.fbox{background:linear-gradient(160deg,#1f2937,#0b1222);border:3px solid var(--rc,#334155);border-radius:14px;padding:8px 6px;text-align:center;min-width:0}
.fbox img{width:100%;max-width:120px;aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));transition:filter .4s}
.fbox img.sil{filter:brightness(0)}
.fbox img.blur{filter:brightness(0) blur(6px)}
.fbox .nm{font-weight:800;font-size:14px;word-break:break-word}
.fbox.hit{animation:hit .4s}
.vsx{font-weight:900;font-size:24px;color:var(--acc);font-style:italic;text-shadow:0 2px 0 #b45309}
.hp{height:10px;background:#334155;border-radius:9px;overflow:hidden;margin:6px 0 2px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#86efac);transition:width .5s}
@keyframes hit{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.teamrow{display:flex;gap:6px;justify-content:center}
.teamrow img{width:40px;height:40px;object-fit:contain;background:var(--pan2);border-radius:10px;padding:2px}
.teamrow img.act{outline:2px solid var(--acc)}
.teamrow img.ko{filter:grayscale(1) opacity(.35)}
.qbox{background:var(--pan);border-radius:14px;padding:10px}
.tbar{height:8px;background:#334155;border-radius:9px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--acc)}
.tbar i.low{background:var(--red)}
.adv{font-size:12px;color:#fde047;text-align:center;margin-top:4px}
.qtxt{text-align:center;font-size:17px;font-weight:700;margin:10px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answers button{padding:12px 6px;min-height:48px}
.answers button.good{background:var(--grn);color:#fff}
.answers button.bad{background:var(--red);color:#fff}
.blog{min-height:18px;font-size:13px;color:#cbd5e1;text-align:center;margin-top:8px}

.code{font-family:ui-monospace,monospace;font-size:24px;font-weight:900;letter-spacing:3px;color:var(--acc)}
.item{display:flex;align-items:center;gap:6px;background:var(--pan);border-radius:12px;padding:10px;margin-bottom:8px}
.item button{padding:8px 10px}
.trade{background:var(--pan);border-radius:14px;padding:10px;margin-bottom:10px}
.tr-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0}
.tr-c{width:120px;text-align:center}
.trade.small .tr-c{width:100px}
.arrow{font-size:26px}
.steps{font-size:13px;color:var(--mut);text-align:center}
.menu{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.menu button{text-align:left;padding:14px;background:var(--pan)}
.lots{display:flex;flex-direction:column;gap:14px}
.lot{display:flex;gap:12px;align-items:center;background:var(--pan);border-radius:14px;padding:14px 10px 10px}
.lot .card{width:118px;flex:none}
.lot-i{flex:1;display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.price{font-size:20px;font-weight:900;color:var(--acc)}
</style>
</head>
<body>
<div id="splash"><div class="logo xl">Poké<b>Masters</b></div><div class="mut">Chargement…</div></div>
<div id="login" class="hidden">
  <div class="logo xl">Poké<b>Masters</b></div>
  <span class="ball" style="width:110px"></span>
  <p>Collectionne les cartes Pokémon, combats et échange avec tes amis !</p>
  <button class="btn-y big" id="btnLogin">Se connecter avec Google</button>
</div>
<header id="top" class="hidden">
  <div class="logo">Poké<b>Masters</b></div>
  <div class="res"><span class="pill"><b id="coins">0</b> ₽</span><span class="pill">🎁 <b id="boosters">0</b> <span id="timer"></span></span></div>
</header>
<main id="app" class="hidden">

async function fetchJSON(url) {
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(url); if (r.ok) return await r.json(); } catch (e) {}
    await sleep(400 * (i + 1));
  }
  throw new Error('réseau');
}
function getMeta(id) {
  id = +id;
  if (META[id]) return Promise.resolve(META[id]);
  if (PENDING[id]) return PENDING[id];
  PENDING[id] = (async () => {
    let p, s;
    if (MEGA[id]) { p = await fetchJSON(API + 'pokemon/' + id); s = await fetchJSON(p.species.url); }
    else [p, s] = await Promise.all([fetchJSON(API + 'pokemon/' + id), fetchJSON(API + 'pokemon-species/' + id)]);
    const fr = s.names.find(n => n.language.name === 'fr');
    let name = fr ? fr.name : s.name;
    if (MEGA[id] && String(p.name).includes('mega')) name = 'Méga-' + name + (MEGA[id][1] ? ' ' + MEGA[id][1] : '');
    const st = {}; p.stats.forEach(x => { st[x.stat.name] = x.base_stat; });
    const s6 = [st.hp, st.attack, st.defense, st['special-attack'], st['special-defense'], st.speed].map(v => v || 50);
    const b = s6.reduce((a, c) => a + c, 0);
    const m = { n: name, t: p.types.slice().sort((a, c) => a.slot - c.slot).map(x => x.type.name), s: s6, b, r: rarityOf(id, b) };
    META[id] = m; saveMeta(); delete PENDING[id];
    return m;
  })();
  PENDING[id].catch(() => { delete PENDING[id]; });
  return PENDING[id];
}
async function loadMetas(ids) {
  const list = [...new Set(ids.map(Number))].filter(id => id >= 1 && (id <= MAX || MEGA[id]) && !META[id]);
  let i = 0;
  const worker = async () => { while (i < list.length) { const id = list[i++]; try { await getMeta(id); } catch (e) {} } };
  await Promise.all(Array.from({ length: Math.min(8, list.length) }, worker));
}
const TRIED = new Set();
function needMetas(ids, cb) {
  const miss = [...new Set(ids.map(Number))].filter(id => !META[id] && !TRIED.has(id));
  if (!miss.length) return;
  miss.forEach(id => TRIED.add(id));
  loadMetas(miss).then(cb);
}

/* ================= CLÉS DE CARTES : "25" normal · "25s" shiny · "6x" Ultra Rare EX ================= */

/* ================= TIRAGE ================= */
function rollRarity() { let x = Math.random() * 100; for (let r = 0; r < ODDS.length; r++) { if (x < ODDS[r]) return r; x -= ODDS[r]; } return 0; }
async function pickIdOfRarity(r) {
  if (r >= 6) return MYTH[rand(MYTH.length)];
  if (r === 5) return LEG[rand(LEG.length)];
  if (r === 4) return MEGA_IDS[rand(MEGA_IDS.length)];
  for (let round = 0; round < 5; round++) {
    const c = new Set();
    while (c.size < 8) { const id = 1 + rand(MAX); if (!SPECIAL.has(id)) c.add(id); }
    const cand = [...c];
    let hit = cand.find(id => META[id] && META[id].r === r);
    if (hit) return hit;
    await loadMetas(cand);
    hit = cand.find(id => META[id] && META[id].r === r);
    if (hit) return hit;
  }
  const known = Object.keys(META).map(Number).filter(id => id <= MAX && !SPECIAL.has(id) && META[id].r === r);
  if (known.length) return known[rand(known.length)];
  return r === 3 ? EPIC_FB[rand(EPIC_FB.length)] : 1 + rand(151);
}
function rollPack() {
  return Promise.all(Array.from({ length: PER_PACK }, async () => {
    const r = rollRarity();
    if (r === 7) return EXP[rand(EXP.length)] + 'x';
    const id = await pickIdOfRarity(r);
    return id + (Math.random() < SHINY ? 's' : '');
  }));
}

function burst(c, lvl) {
  const b = document.createElement('div'); b.className = 'burst';
  let h = `<div class="rays${c === 'rb' ? ' rb' : ''}" style="--gc:${c}"></div>`;
  for (let i = 0; i < lvl * 10; i++) {
    const a = Math.random() * 6.283, d = 100 + Math.random() * 260;
    const col = c === 'rb' ? `hsl(${rand(360)},90%,60%)` : c;
    h += `<i class="pt" style="background:${col};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;animation-delay:${Math.random() * .25}s"></i>`;
  }
  if (lvl >= 5) h += '<div class="flash"></div>';
  b.innerHTML = h; document.body.appendChild(b);
  setTimeout(() => b.remove(), 2300);
}

async function newFriendCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (let t = 0; t < 6; t++) {
    let c = ''; for (let i = 0; i < 6; i++) c += A[rand(A.length)];
    const q = await getDocs(query(collection(db, 'users'), where('friendCode', '==', c)));
    if (q.empty) return c;
  }
  return ('Z' + Date.now().toString(36)).slice(-6).toUpperCase();
}

async function initUser(u) {
  const ref = doc(db, 'users', u.uid);
  const snap = await getDoc(ref);
  const now = Date.now();
  const base = { pseudo: '', coins: 300, boosters: BOOST_MAX, lastBoost: now, cards: {}, showcase: [], friends: [], bestWave: 0, usedCodes: [] };
  if (!snap.exists()) {
    await setDoc(ref, { ...base, friendCode: await newFriendCode() });
  } else {
    const d = snap.data(), fix = {};
    if ('email' in d) fix.email = deleteField();
    if (!d.friendCode) fix.friendCode = await newFriendCode();
    if ((d.boosters || 0) > BOOST_MAX) { fix.boosters = BOOST_MAX; fix.lastBoost = now; }
    for (const [k, v] of Object.entries(base)) if (d[k] === undefined) fix[k] = v;
    if (Object.keys(fix).length) await updateDoc(ref, fix);
  }
  const warn = e => console.warn(e);
  unsubs.push(onSnapshot(ref, s => { if (!s.exists()) return; ME = s.data(); onMe(); }, warn));
  unsubs.push(onSnapshot(query(collection(db, 'friendRequests'), where('to', '==', u.uid)), s => {
    FR_IN = s.docs.map(d => ({ id: d.id, ...d.data() })); updateBadge(); if (view === 'friends') renderFriends();

function boostState() {
  const now = Date.now();
  let b = Math.min(ME?.boosters ?? 0, BOOST_MAX), last = ME?.lastBoost ?? now;
  if (last && typeof last.toMillis === 'function') last = last.toMillis();
  if (b >= BOOST_MAX) return { b, last: now, next: 0 };
  const g = Math.floor((now - last) / BOOST_MS);
  if (g > 0) { b = Math.min(BOOST_MAX, b + g); last = b >= BOOST_MAX ? now : last + g * BOOST_MS; }
  return { b, last, next: b >= BOOST_MAX ? 0 : last + BOOST_MS - now };
}
const nextTxt = st => st.b >= BOOST_MAX ? '✅ Stock plein ! Le minuteur reprendra quand tu ouvriras un booster.' : '⏳ Prochain booster dans ' + fmt(st.next);

async function openBooster(buy) {
  if (opening || !ME) return;
  const st = boostState();
  if (!buy && st.b <= 0) return toast('Plus de booster ! Attends le minuteur ⏳');
  if (buy && (ME.coins || 0) < BOOST_PRICE) return toast(`Il te faut ${BOOST_PRICE} ${PD}.`);
  opening = true; vib(20);
  const before = { ...cardsOf() };
  const ov = $('#opening');
  ov.classList.remove('hidden');
  ov.innerHTML = `<div class="op-wrap">
    <div class="op-hint">✂️ Glisse ton doigt sur le paquet pour l’ouvrir<br><small class="mut">(ou touche-le)</small></div>
    <div class="pack big" id="bigPack"><div class="ptop"></div><div class="cut" id="cut"></div><div class="plogo">PokéMasters</div><span class="ball"></span><div class="psub">5 cartes</div></div>
    <div class="mut" id="opLoad">${buy ? `−${BOOST_PRICE} ${PD}` : ''}</div></div>`;
  let keys = null, err = null;
  const job = (async () => {
    const ks = await rollPack();
    const cnt = {}; ks.forEach(k => { cnt[k] = (cnt[k] || 0) + 1; });
    const upd = {};
    for (const [k, n] of Object.entries(cnt)) upd['cards.' + k] = increment(n);
    if (buy) upd.coins = increment(-BOOST_PRICE);
    else { upd.boosters = st.b - 1; upd.lastBoost = st.b >= BOOST_MAX ? Date.now() : st.last; }
    await updateDoc(meRef(), upd);
    await loadMetas(ks.map(keyId));
    ks.forEach(k => { const im = new Image(); im.src = img(keyId(k), keySh(k)); });
    keys = ks;
  })().catch(e => { console.error(e); err = e; });

  const pack = $('#bigPack');
  let sx = null, torn = false;
  const tear = async () => {
    if (torn) return; torn = true;
    pack.classList.add('torn'); vib(40);
    if (!keys && !err) { $('#opLoad').textContent = 'Préparation des cartes…'; await job; }
    if (err) { closeOpening(); return toast('Oups, souci de connexion. Réessaie !'); }
    setTimeout(() => revealFlow(keys, before), 500);
  };
  pack.addEventListener('pointerdown', e => { sx = e.clientX; try { pack.setPointerCapture(e.pointerId); } catch (_) {} });
  pack.addEventListener('pointermove', e => {
    if (sx === null || torn) return;
    const dx = Math.abs(e.clientX - sx);
    $('#cut').style.width = Math.min(100, dx / 1.5) + '%';
    if (dx > 110) tear();
  });
  pack.addEventListener('pointerup', () => { sx = null; tear(); });
}

function revealFlow(keys, before) {
  const ov = $('#opening');
  const score = k => kr(k) + (keySh(k) ? 3.5 : 0);
  const order = [...keys].sort((a, b) => score(a) - score(b));
  let i = 0, flipped = false;

  const summary = () => {
    const newCount = new Set(order.filter(k => !before[k])).size;
    const st = boostState();
    ov.innerHTML = `<div class="op-wrap">
      <h2 style="margin:0">Ton booster 🎁</h2>
      ${newCount ? `<div class="good">🆕 ${newCount} nouvelle${newCount > 1 ? 's' : ''} carte${newCount > 1 ? 's' : ''} !</div>` : '<div class="mut">Que des cartes que tu avais déjà</div>'}
      <div class="sumgrid">${order.map(k => pcard(k, 0, { isNew: !before[k], eager: true })).join('')}</div>
      <div class="row c">${st.b > 0 ? `<button class="btn-y big" id="opAgain">Encore un ! (🎁 ${st.b})</button>` : `<button class="big" id="opBuy">🛒 Acheter (${BOOST_PRICE} ${PD})</button>`}<button class="big btn-y" id="opOk">OK</button></div>
    </div>`;
    opening = false;
    $('#opOk').onclick = closeOpening;
    if ($('#opAgain')) $('#opAgain').onclick = () => { closeOpening(); openBooster(false); };
    if ($('#opBuy')) $('#opBuy').onclick = () => { closeOpening(); buyConfirm(); };
  };

  const show = () => {
    const k = order[i], last = i === order.length - 1, fx = fxOf(k);
    const lv = fx ? fx.l : 0;
    flipped = false;
    ov.innerHTML = `<div class="op-top"><span class="pill">Carte ${i + 1} / ${order.length}</span><button class="sm" id="opAll">Tout révéler ⏩</button></div>
      <div class="op-wrap">
        <div class="op-msg" id="opMsg">${lv >= 4 ? '😱 Elle brille énormément…' : lv >= 2 ? '✨ Quelque chose de spécial…' : ''}</div>
        <div class="flip enter${BACK_OK ? ' hasBack' : ''}${lv >= 2 ? ' charge' : ''}${lv >= 4 ? ' shake' : ''}" id="fl" style="--gc:${fx ? fx.g : '#fff'}"><div class="fi">${BACK}<div class="front">${pcard(k, 0, { isNew: !before[k], eager: true })}</div></div></div>
        <div class="op-hint" id="opH">Touche la carte pour la retourner</div>
      </div>`;
    $('#opAll').onclick = summary;
    $('#fl').onclick = () => {
      const fl = $('#fl');
      if (!flipped) {
        flipped = true;
        fl.classList.add('on'); fl.classList.remove('charge', 'shake', 'enter');
        if (fx) {
          setTimeout(() => burst(fx.c, fx.l), 250);
          vib(lv >= 5 ? [80, 40, 80, 40, 200] : lv >= 3 ? [60, 40, 120] : 30);
          if (lv >= 2) fl.classList.add('wow');
          $('#opMsg').textContent = fx.m;
        } else { vib(15); $('#opMsg').textContent = ''; }
        $('#opH').textContent = last ? 'Touche pour voir le résumé' : 'Touche pour la carte suivante';
      } else {
        i++;
        if (i >= order.length) summary(); else show();
      }
    };
  };
  show();
}

  $('#opening').classList.add('hidden'); $('#opening').innerHTML = '';
  opening = false;
  if (view === 'booster') renderBooster();

function drawCardGrid() {
  const g = $('#cGrid'); if (!g || !ME) return;
  const c = cardsOf(), owned = ownedKeys(c);
  const dc = dexCount(c);
  $('#pTxt').textContent = `Pokédex ${dc} / ${MAX}`;
  $('#pBar').style.width = (dc / MAX * 100) + '%';
  $$('.seg button').forEach(b => b.classList.toggle('on', b.dataset.m === cMode));
  $('#fS').classList.toggle('hidden', cMode === 'dex');
  const q = norm(cQ.trim()).replace('#', '');
  const ok = (id, r) => {
    const m = META[id];
    if (cG !== 'all' && genOf(id) !== +cG) return false;
    if (cR !== 'all' && r !== +cR) return false;
    if (q && !(String(baseOf(id)) === q || (m && norm(m.n).includes(q)))) return false;
    return true;
  };
  if (cMode === 'mine') {
    const ks = owned.filter(k => ok(keyId(k), kr(k)) && (!cShiny || keySh(k)));
    ks.sort((a, b) => cSort === 'rar' ? (kr(b) - kr(a) || keyId(a) - keyId(b)) : cSort === 'cnt' ? (c[b] - c[a] || keyId(a) - keyId(b)) : (baseOf(keyId(a)) - baseOf(keyId(b)) || keyId(a) - keyId(b) || (a < b ? -1 : 1)));
    g.innerHTML = ks.length ? ks.map(k => pcard(k, c[k])).join('') : '<p class="mut">Aucune carte ici. Ouvre des boosters ! 🎁</p>';
    needMetas(ks.map(keyId), drawCardGrid);
  } else {
    const ids = [];
    for (let id = 1; id <= MAX; id++) ids.push(id);
    ids.push(...MEGA_IDS);
    const out = [];
    for (const id of ids) {
      const opts = cShiny ? [id + 's'] : [String(id), id + 'x', id + 's'];
      const k = opts.find(x => c[x] > 0);
      const r = k ? kr(k) : (META[id]?.r ?? -1);
      if (!ok(id, r)) continue;
      if (cShiny && !k) continue;
      out.push(k ? pcard(k, c[k]) : missingCard(id));
    }
    g.innerHTML = out.join('') || '<p class="mut">Rien à afficher.</p>';
  }
}

async function randomNames(n, exclude) {
  const names = new Set(), bad = META[exclude]?.n;
  for (let t = 0; t < 3 && names.size < n; t++) {
    const pool = Object.keys(META).map(Number).filter(id => id !== exclude);
    for (const id of shuffle(pool)) { if (META[id].n !== bad) names.add(META[id].n); if (names.size >= n) break; }
    if (names.size < n) await loadMetas(Array.from({ length: 8 }, () => 1 + rand(MAX)));
  }
  return [...names].slice(0, n);
}
async function makeQ() {
  const f = B.foe, m = f.m, lvl = B.lvl, isMega = !!MEGA[f.id];
  const kinds = isMega ? ['sil', 'sil', 'type', 'weak', 'stat'] : ['sil', 'sil', 'type', 'gen', 'weak', 'dex', 'stat'];
  let kind = kinds[rand(kinds.length)];
  const allT = Object.keys(TYPES);
  if (kind === 'weak' && !allT.some(t => eff(t, m.t) > 1)) kind = 'type';
  if (kind === 'stat' && m.s.filter(v => v === Math.max(...m.s)).length > 1) kind = 'type';
  const q = { kind, cls: '', txt: '', opts: [], ans: '' };
  if (kind === 'sil') {
    q.cls = lvl >= 2 && Math.random() < 0.5 ? 'blur' : 'sil';
    q.txt = q.cls === 'blur' ? 'Quel est ce Pokémon caché derrière cette ombre floue ?' : 'Quel est ce Pokémon caché derrière cette ombre ?';
    q.ans = m.n; q.opts = shuffle([m.n, ...(await randomNames(3, f.id))]);
  } else if (kind === 'type') {
    q.txt = m.t.length > 1 ? `Quel est l’un des deux types de ${m.n} ?` : `Quel est le type de ${m.n} ?`;
    q.ans = TYPES[m.t[rand(m.t.length)]][0];
    q.opts = shuffle([q.ans, ...shuffle(allT.filter(t => !m.t.includes(t))).slice(0, 3).map(t => TYPES[t][0])]);
  } else if (kind === 'gen') {
    q.txt = `Dans quelle génération ${m.n} est-il apparu pour la première fois ?`;
    const g = genOf(f.id); const s = new Set([g]); while (s.size < 4) s.add(1 + rand(9));
    q.ans = 'Génération ' + g; q.opts = shuffle([...s].map(x => 'Génération ' + x));
  } else if (kind === 'weak') {
    q.txt = `Quel type d’attaque est super efficace contre ${m.n} ?`;
    const goods = allT.filter(t => eff(t, m.t) > 1), bads = allT.filter(t => eff(t, m.t) <= 1);
    q.ans = TYPES[goods[rand(goods.length)]][0];
    q.opts = shuffle([q.ans, ...shuffle(bads).slice(0, 3).map(t => TYPES[t][0])]);
  } else if (kind === 'dex') {
    q.txt = `Quel est le numéro de ${m.n} dans le Pokédex national ?`;
    const s = new Set([f.id]); const span = lvl >= 2 ? 15 : 60;
    while (s.size < 4) { const x = f.id + rand(span * 2 + 1) - span; if (x >= 1 && x <= MAX) s.add(x); }
    q.ans = 'N° ' + f.id; q.opts = shuffle([...s].map(x => 'N° ' + x));
  } else {
    q.txt = `Quelle est la statistique la plus élevée de ${m.n} ?`;
    const mx = Math.max(...m.s), bi = m.s.indexOf(mx);
    q.ans = SN6[bi];
    q.opts = shuffle([q.ans, ...shuffle(SN6.filter((_, i) => m.s[i] < mx)).slice(0, 3)]);
  }
  return q;
}

function startTimer() {

function answer(opt) {
  if (!B || B.lock) return;

  const b = B, me = b.team[b.act], f = b.foe, q = b.q, ok = opt === q.ans;
  $$('.answers button').forEach(btn => {

    me.hp = Math.max(0, me.hp - dmg);

    if (me.hp <= 0) {

    <p class="mut">🃏 ${cardTotal(f)} cartes · Pokédex ${dexCount(f.cards || {})} / ${MAX} · 🏆 vague ${f.bestWave || 0}</p>
    <div class="cgrid">${sc.length ? sc.map(k => pcard(k, 0)).join('') : '<p class="mut">Vitrine vide.</p>'}</div>
    <button class="wide" id="sfX">Fermer</button>`);
  $('#sfX').onclick = closeSheet;
}

let TW = null;
async function tradeWizard(fid) {
  await refreshFriends();
  const f = FRIENDS[fid]; if (!f) return toast('Ami introuvable.');
  TW = { fid, f, step: 1, want: null, give: null, onlyMiss: true, onlyDup: true };
  openSheet('<p class="c mut">Chargement des cartes…</p>');
  await loadMetas([...ownedKeys(f.cards || {}), ...ownedKeys()].map(keyId));
  drawTW();
}
function drawTW() {
  if (!TW) return;
  const { f, step } = TW, mine = cardsOf(), his = f.cards || {};
  const sorter = (a, b) => kr(b) - kr(a) || keyId(a) - keyId(b);
  let html = `<div class="steps">Étape ${step} / 3</div>`;
  if (step === 1) {
    let ks = ownedKeys(his); if (TW.onlyMiss) ks = ks.filter(k => !(mine[k] > 0)); ks.sort(sorter);
    html += `<h2>1. Quelle carte veux-tu de ${esc(f.pseudo)} ?</h2>
      <label class="chk"><input type="checkbox" id="twF" ${TW.onlyMiss ? 'checked' : ''}> Seulement celles qui me manquent</label>
      <div class="cgrid">${ks.map(k => pcard(k, his[k], { sel: TW.want === k, tag: !(mine[k] > 0) ? '🆕' : '' })).join('') || '<p class="mut">Aucune carte ici.</p>'}</div>
      <div class="sticky"><button id="twX">Annuler</button><button class="btn-y" id="twN" ${TW.want ? '' : 'disabled'}>Suivant ➜</button></div>`;
  } else if (step === 2) {
    let ks = ownedKeys(mine); if (TW.onlyDup) ks = ks.filter(k => mine[k] > 1); ks.sort(sorter);
    html += `<h2>2. Quelle carte lui donnes-tu ?</h2>
      <label class="chk"><input type="checkbox" id="twF" ${TW.onlyDup ? 'checked' : ''}> Seulement mes doublons</label>
      <div class="cgrid">${ks.map(k => pcard(k, mine[k], { sel: TW.give === k, tag: !(his[k] > 0) ? '🎁 Il ne l’a pas' : '', tagColor: '#16a34a' })).join('') || '<p class="mut">Aucune carte ici. Décoche la case pour tout voir.</p>'}</div>
      <div class="sticky"><button id="twB">⬅ Retour</button><button class="btn-y" id="twN" ${TW.give ? '' : 'disabled'}>Suivant ➜</button></div>`;
  } else {
    html += `<h2>3. Vérifie ton échange</h2>
      <div class="tr-row"><div class="tr-c"><div class="mut">Tu donnes</div>${pcard(TW.give, 0)}</div><span class="arrow">⇄</span><div class="tr-c"><div class="mut">Tu reçois</div>${pcard(TW.want, 0)}</div></div>
      <p class="c mut">${esc(f.pseudo)} devra accepter l’échange.</p>
      <div class="sticky"><button id="twB">⬅ Retour</button><button class="btn-g" id="twS">📨 Envoyer</button></div>`;
  }
  const body = $('#sheetBody'); body.innerHTML = html;
  $('#sheet').scrollTop = 0;
  body.querySelectorAll('.card[data-k]').forEach(c => c.onclick = () => {
    if (TW.step === 1) TW.want = c.dataset.k; else if (TW.step === 2) TW.give = c.dataset.k; else return;
    const sc = $('#sheet').scrollTop; drawTW(); $('#sheet').scrollTop = sc;
  });
  const F = $('#twF'); if (F) F.onchange = () => { if (TW.step === 1) TW.onlyMiss = F.checked; else TW.onlyDup = F.checked; drawTW(); };
  if ($('#twX')) $('#twX').onclick = () => { TW = null; closeSheet(); };
  if ($('#twN')) $('#twN').onclick = () => { TW.step++; drawTW(); };
  if ($('#twB')) $('#twB').onclick = () => { TW.step--; drawTW(); };
  if ($('#twS')) $('#twS').onclick = async () => {
    if (!(cardsOf()[TW.give] > 0)) return toast('Tu n’as plus cette carte.');
    $('#twS').disabled = true;
    try {
      await addDoc(collection(db, 'trades'), { from: U.uid, fromName: ME.pseudo, to: TW.fid, toName: TW.f.pseudo || '', give: TW.give, want: TW.want, status: 'pending', at: Date.now() });
      TW = null; closeSheet(); toast('Proposition envoyée ! 📨');
    } catch (e) { toast('Erreur : ' + (e.code || e.message)); $('#twS').disabled = false; }
  };
}
async function acceptTrade(t) {
  if (!t) return;
  await runTransaction(db, async tx => {
    const aRef = doc(db, 'users', t.from), bRef = meRef(), tRef = doc(db, 'trades', t.id);
    const tr = await tx.get(tRef), a = await tx.get(aRef), b = await tx.get(bRef);
    if (!tr.exists() || tr.data().status !== 'pending') throw new Error('Échange déjà traité.');
    if (!((a.data().cards || {})[t.give] > 0)) throw new Error(`${t.fromName} n’a plus cette carte.`);
    if (!((b.data().cards || {})[t.want] > 0)) throw new Error('Tu n’as plus cette carte.');
    tx.update(aRef, { ['cards.' + t.give]: increment(-1), ['cards.' + t.want]: increment(1) });
    tx.update(bRef, { ['cards.' + t.want]: increment(-1), ['cards.' + t.give]: increment(1) });
    tx.update(tRef, { status: 'done' });
  });
  tradeAnim(t.want, t.give, t.fromName || 'ton ami');
}

/* ================= PLUS ================= */
function renderMore() {
  if (!ME) return;
  const c = cardsOf();
  const sc = (ME.showcase || []).filter(k => c[k] > 0);
  $('#v-more').innerHTML = `<h2>☰ Plus</h2>
    <div class="box"><b>✏️ Pseudo</b><div class="row" style="margin-top:8px"><input id="psE" maxlength="16" value="${esc(ME.pseudo)}" style="flex:1"><button id="psSave">OK</button></div></div>
    <div class="box"><b>🎟️ Code cadeau</b><div class="row" style="margin-top:8px"><input id="promoIn" placeholder="CODE" style="flex:1;text-transform:uppercase"><button class="btn-y" id="btnPromo">Valider</button></div></div>
    <div class="box"><b>⭐ Ma vitrine (${sc.length}/6)</b>
      <div class="cgrid">${sc.length ? sc.map(k => pcard(k, 0)).join('') : ''}</div>
      <p class="mut" style="margin:4px 0 0">Touche une carte dans « Cartes » pour l’ajouter à ta vitrine.</p></div>
    <div class="menu">
      <button id="mOdds">📊 Taux des boosters</button>
      <button id="mOut">🚪 Déconnexion</button>
    </div>
    <p class="mut c">${ME.coins || 0} ${PD} · 🃏 ${cardTotal(ME)} cartes · Pokédex ${dexCount(c)} / ${MAX} · 🏆 vague ${ME.bestWave || 0}</p>`;
  needMetas(sc.map(keyId), () => { if (view === 'more') renderMore(); });
  $('#psSave').onclick = async () => {
    const p = $('#psE').value.trim().slice(0, 16);
    if (p.length < 2) return toast('2 caractères minimum.');
    await updateDoc(meRef(), { pseudo: p }); toast('Pseudo changé ✅');
  };
  $('#btnPromo').onclick = async () => {
    const code = $('#promoIn').value.trim().toUpperCase();
    const v = PROMO[code];
    if (!v) return toast('Code invalide.');
    if ((ME.usedCodes || []).includes(code)) return toast('Tu as déjà utilisé ce code.');
    $('#btnPromo').disabled = true;
    try {
      await runTransaction(db, async tx => {
        const s = await tx.get(meRef());
        if ((s.data().usedCodes || []).includes(code)) throw new Error('Tu as déjà utilisé ce code.');
        tx.update(meRef(), { coins: increment(v), usedCodes: arrayUnion(code) });
      });
      vib(50); toast(`🎉 +${v} ${PD} !`);
    } catch (e) { toast(e.message || 'Erreur'); }
    if ($('#btnPromo')) $('#btnPromo').disabled = false;
  };
  $('#mOdds').onclick = showOdds;
  $('#mOut').onclick = () => signOut(auth);
}

/* ================= ENCHÈRES (contre des bots) ================= */
const BOTS = ['Sacha', 'Ondine', 'Pierre', 'Flora', 'Iris', 'Cynthia', 'Red', 'Blue', 'Max', 'Aurore'];
let AUC = null, aucBusy = false;
const aucKey = () => 'pm_auc2_' + (U ? U.uid : '');
function loadAuc() {
  try { AUC = JSON.parse(localStorage.getItem(aucKey()) || 'null'); } catch (e) { AUC = null; }
  if (!AUC || !Array.isArray(AUC.lots)) AUC = { lots: [] };
  fillAuc();
}
function saveAuc() { try { localStorage.setItem(aucKey(), JSON.stringify(AUC)); } catch (e) {} }
async function newLot() {
  const r = [2, 3, 3, 4, 4, 5, 5, 6, 7][rand(9)];
  let k;
  if (r === 7) k = EXP[rand(EXP.length)] + 'x';
  else k = (await pickIdOfRarity(r)) + (Math.random() < 0.08 ? 's' : '');
  try { await getMeta(keyId(k)); } catch (e) {}
  const base = Math.round(ABASE[kr(k)] * (keySh(k) ? 2 : 1));
  return { k, base, price: base, lead: BOTS[rand(BOTS.length)], end: Date.now() + (4 + rand(6)) * 60000 };
}
async function fillAuc() {
  if (aucBusy || !AUC) return; aucBusy = true;
  try { while (AUC.lots.length < 4) { AUC.lots.push(await newLot()); saveAuc(); if (view === 'auction') renderAuction(); } }
  catch (e) {} finally { aucBusy = false; }
}
const nextBid = l => l.price + Math.max(5, Math.ceil(l.price * 0.08));
async function aucTick() {
  if (!AUC || !ME || aucBusy) return;
  let changed = false;
  const now = Date.now();
  for (let i = AUC.lots.length - 1; i >= 0; i--) {
    const l = AUC.lots[i];
    if (now >= l.end) {
      AUC.lots.splice(i, 1); changed = true;
      if (l.lead === 'me') {
        if ((ME.coins || 0) >= l.price) {
          try { await updateDoc(meRef(), { coins: increment(-l.price), ['cards.' + l.k]: increment(1) }); vib([40, 30, 80]); toast(`🔨 Enchère gagnée : ${META[keyId(l.k)]?.n || 'carte'} !`); } catch (e) {}
        } else toast(`Enchère perdue : pas assez de ${PD}`);
      }
      continue;
    }
    // Les cartes très rares montent moins haut : chères mais possibles !
    const ratio = l.price / l.base, cap = kr(l.k) >= 5 ? 1.5 : 2.5;
    const chance = (l.lead === 'me' ? 0.05 : 0.015) / Math.max(1, ratio);
    if (ratio < cap && Math.random() < chance) {
      l.price = nextBid(l);
      const prev = l.lead;
      l.lead = shuffle(BOTS.filter(b => b !== prev))[0];
      if (prev === 'me') toast(`😱 ${l.lead} a surenchéri !`);
      if (l.end - now < 15000) l.end = now + 15000;
      changed = true;
    }
  }
  if (changed) { saveAuc(); if (view === 'auction') renderAuction(); fillAuc(); }
  else if (view === 'auction') $$('[data-end]').forEach(el => { const l = AUC.lots[+el.dataset.end]; if (l) el.textContent = fmt(l.end - now); });
}
function renderAuction() {
  if (!ME || !AUC) return;
  const now = Date.now(), c = cardsOf();
  $('#v-auction').innerHTML = `<h2>🔨 Enchères</h2>
    <p class="mut">D’autres dresseurs surenchérissent ! Si tu es en tête à la fin, tu paies et tu gagnes la carte. Gagne des ${PD} en combat et en vendant des cartes.</p>
    <div class="lots">${AUC.lots.map((l, i) => { const own = c[l.k] > 0; return `<div class="lot">${pcard(l.k, 0, own ? {} : { tag: '🆕 Tu ne l’as pas', tagColor: '#16a34a' })}
      <div class="lot-i">${own ? `<span class="mut">✅ Tu l’as déjà (×${c[l.k]})</span>` : '<span class="good">🆕 Tu ne la possèdes pas encore !</span>'}
      <span class="mut">Meilleure offre</span><span class="price">${l.price} ${PD}</span>
      <span>${l.lead === 'me' ? '<span class="good">👑 C’est toi !</span>' : 'par ' + esc(l.lead)}</span>
      <span class="mut">⏱ <b data-end="${i}">${fmt(l.end - now)}</b></span>
      <button class="btn-y" data-bid="${i}" ${l.lead === 'me' ? 'disabled' : ''}>Enchérir ${nextBid(l)} ${PD}</button></div></div>`; }).join('') || '<p class="mut c">Chargement des lots…</p>'}</div>`;
  needMetas(AUC.lots.map(l => keyId(l.k)), () => { if (view === 'auction') renderAuction(); });
  $$('[data-bid]').forEach(b => b.onclick = () => {
    const l = AUC.lots[+b.dataset.bid]; if (!l) return;
    const p = nextBid(l);
    if ((ME.coins || 0) < p) return toast(`Pas assez de ${PD} (il te faut ${p}).`);
    l.price = p; l.lead = 'me';
    if (l.end - Date.now() < 15000) l.end = Date.now() + 15000;
    saveAuc(); vib(20); renderAuction();
  });
}
</script>
